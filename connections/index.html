<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections · Yuan Gao</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #f9df6d;
            --yellow-text: #5a4e1a;
            --green: #a0c35a;
            --green-text: #2a3d0f;
            --blue: #b0c4ef;
            --blue-text: #1a2a4a;
            --purple: #ba81c5;
            --purple-text: #3a1a42;
            --bg: #fafafa;
            --card-bg: #efefe6;
            --card-hover: #ddddd0;
            --card-selected: #5a594e;
            --card-selected-text: #fff;
            --text: #1a1a1a;
            --text-muted: #787878;
            --wrong-shake: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Libre Franklin', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
        }

        .header {
            padding: 32px 20px 8px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .game-area {
            width: 100%;
            max-width: 600px;
            padding: 16px 20px;
        }

        /* Solved groups stack at top */
        .solved-groups {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }

        .solved-row {
            border-radius: 10px;
            padding: 16px 20px;
            text-align: center;
            animation: solvedReveal 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0.9);
        }

        @keyframes solvedReveal {
            to { opacity: 1; transform: scale(1); }
        }

        .solved-row.yellow { background: var(--yellow); color: var(--yellow-text); }
        .solved-row.green { background: var(--green); color: var(--green-text); }
        .solved-row.blue { background: var(--blue); color: var(--blue-text); }
        .solved-row.purple { background: var(--purple); color: var(--purple-text); }

        .solved-label {
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .solved-words {
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* Word grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .cell {
            background: var(--card-bg);
            border: none;
            border-radius: 10px;
            padding: 20px 6px;
            font-family: 'Libre Franklin', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            color: var(--text);
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
        }

        .cell:hover:not(.selected):not(.disabled) {
            background: var(--card-hover);
        }

        .cell.selected {
            background: var(--card-selected);
            color: var(--card-selected-text);
            transform: scale(0.97);
        }

        .cell.disabled {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .cell.wrong {
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            padding: 8px 0 16px;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Libre Franklin', sans-serif;
            padding: 12px 28px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 28px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--text);
            color: var(--text);
        }

        .btn-outline:hover:not(:disabled) {
            background: var(--text);
            color: white;
        }

        .btn-filled {
            background: var(--text);
            border: 2px solid var(--text);
            color: white;
        }

        .btn-filled:hover:not(:disabled) {
            background: #333;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* Mistakes tracker */
        .mistakes {
            text-align: center;
            padding: 12px 0;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .mistake-dots {
            display: inline-flex;
            gap: 6px;
            margin-left: 8px;
        }

        .mistake-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--text);
            transition: all 0.3s ease;
        }

        .mistake-dot.used {
            background: #ccc;
            transform: scale(0.7);
        }

        /* Feedback toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: var(--text);
            color: white;
            padding: 12px 28px;
            border-radius: 28px;
            font-weight: 700;
            font-size: 0.9rem;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* New game overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .overlay-card {
            background: white;
            border-radius: 16px;
            padding: 40px 36px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .overlay.show .overlay-card {
            transform: scale(1);
        }

        .overlay-card h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .overlay-card p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .overlay-card .btn {
            min-width: 160px;
        }

        /* Results screen */
        .results {
            text-align: center;
            padding: 20px 0 10px;
        }

        .results h2 {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .results p {
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Loading state */
        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e0e0e0;
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .cell { padding: 16px 4px; font-size: 0.75rem; min-height: 54px; }
            .game-area { padding: 12px 12px; }
            .header h1 { font-size: 1.6rem; }
        }
        .note { font-size: 0.8rem !important; margin-top: 6px; }
        .note a { color: inherit; }
    </style>
</head>

        let order = [], cursor = 0;
        function nextPuzzle() {
            if (cursor >= order.length) {
                order = PUZZLES.map((_, i) => i);
                for (let i = order.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [order[i], order[j]] = [order[j], order[i]];
                }
                cursor = 0;
            }
            const idx = order[cursor++];
            const p = PUZZLES[idx];
            const words = [...p.words];
            for (let i = words.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [words[i], words[j]] = [words[j], words[i]];
            }
            document.getElementById('pzNo').textContent = `Puzzle ${idx + 1} of ${PUZZLES.length}.`;
            return { idx, words, groups: p.groups };
        }

        // ===== INITIALIZATION =====
        async function newGame() {
            gameOver = false;
            selectedWords.clear();
            solvedGroups = [];
            mistakesLeft = 4;
            guessHistory = [];

            document.getElementById('grid').innerHTML = '<div class="loading-spinner"></div>';
            document.getElementById('solvedGroups').innerHTML = '';
            document.getElementById('results').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('mistakes').style.display = 'none';

            try {
                const data = nextPuzzle();
                puzzle = data;
                remainingWords = [...data.words];
                renderGrid();
                renderMistakes();
                document.getElementById('controls').style.display = 'flex';
                document.getElementById('mistakes').style.display = 'block';
            } catch (err) {
                showToast('Could not load puzzle');
                console.error(err);
            }
        }

        // ===== RENDERING =====
        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            remainingWords.forEach(word => {
                const cell = document.createElement('button');
                cell.className = 'cell' + (selectedWords.has(word) ? ' selected' : '');
                cell.textContent = word;
                cell.onclick = () => toggleWord(word);
                grid.appendChild(cell);
            });

            updateButtons();
        }

        function renderMistakes() {
            const dots = document.getElementById('mistakeDots');
            dots.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const dot = document.createElement('span');
                dot.className = 'mistake-dot' + (i >= mistakesLeft ? ' used' : '');
                dots.appendChild(dot);
            }
        }

        function renderSolvedGroup(group) {
            const container = document.getElementById('solvedGroups');
            const row = document.createElement('div');
            const colorClass = LEVEL_COLORS[group.level] || 'yellow';
            row.className = `solved-row ${colorClass}`;
            row.innerHTML = `
                <div class="solved-label">${group.label}</div>
                <div class="solved-words">${group.words.join(', ')}</div>
            `;
            container.appendChild(row);
        }

        // ===== INTERACTION =====
        function toggleWord(word) {
            if (gameOver) return;

            if (selectedWords.has(word)) {
                selectedWords.delete(word);
            } else if (selectedWords.size < 4) {
                selectedWords.add(word);
            }
            renderGrid();
        }

        function deselectAll() {
            selectedWords.clear();
            renderGrid();
        }

        function shuffleWords() {
            for (let i = remainingWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [remainingWords[i], remainingWords[j]] = [remainingWords[j], remainingWords[i]];
            }
            renderGrid();
        }

        function updateButtons() {
            document.getElementById('submitBtn').disabled = selectedWords.size !== 4;
            document.getElementById('deselectBtn').disabled = selectedWords.size === 0;
        }

        async function submitGuess() {
            if (selectedWords.size !== 4 || gameOver) return;

            const guessArr = Array.from(selectedWords);

            // Check for duplicate guess
            const guessKey = [...guessArr].sort().join(',');
            if (guessHistory.includes(guessKey)) {
                showToast('Already guessed!');
                return;
            }
            guessHistory.push(guessKey);

            try {
                const guess = new Set(guessArr.map(w => w.toUpperCase()));
                let data = { correct: false, close: 0 };
                for (const g of puzzle.groups) {
                    const overlap = g.words.filter(w => guess.has(w)).length;
                    if (overlap === 4) { data = { correct: true, group: g }; break; }
                    data.close = Math.max(data.close, overlap);
                }

                if (data.correct) {
                    // Remove solved words from grid
                    const solvedSet = new Set(data.group.words);
                    remainingWords = remainingWords.filter(w => !solvedSet.has(w));
                    selectedWords.clear();
                    solvedGroups.push(data.group);

                    renderSolvedGroup(data.group);
                    renderGrid();

                    if (remainingWords.length === 0) {
                        endGame(true);
                    }
                } else {
                    // Wrong guess
                    mistakesLeft--;
                    renderMistakes();

                    if (data.close === 3) {
                        showToast('One away...');
                    } else {
                        showToast('Incorrect');
                    }

                    // Shake animation on selected cells
                    document.querySelectorAll('.cell.selected').forEach(cell => {
                        cell.classList.add('wrong');
                        setTimeout(() => cell.classList.remove('wrong'), 500);
                    });

                    selectedWords.clear();
                    renderGrid();

                    if (mistakesLeft <= 0) {
                        endGame(false);
                    }
                }
            } catch (err) {
                showToast('Error checking guess');
                console.error(err);
            }
        }

        async function endGame(won) {
            gameOver = true;
            document.getElementById('controls').style.display = 'none';

            if (!won) {
                // Reveal remaining groups
                const data = { groups: puzzle.groups };

                for (const group of data.groups) {
                    const alreadySolved = solvedGroups.some(sg =>
                        sg.label === group.label
                    );
                    if (!alreadySolved) {
                        await new Promise(r => setTimeout(r, 400));
                        renderSolvedGroup(group);
                    }
                }

                remainingWords = [];
                document.getElementById('grid').innerHTML = '';
            }

            const results = document.getElementById('results');
            results.style.display = 'block';
            results.innerHTML = won
                ? `<h2>Excellent!</h2><p>Solved with ${4 - mistakesLeft} mistake${mistakesLeft === 3 ? '' : 's'}</p>`
                : `<h2>Next time!</h2><p>Better luck on the next puzzle</p>`;
        }

        // ===== TOAST =====
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ===== KEYBOARD SUPPORT =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && selectedWords.size === 4 && !gameOver) {
                submitGuess();
            }
        });

        // ===== AUTO-START =====
        newGame();
    </script>
</body>
</html>
